# Aul — jumlah saham fardu melebihi asal masalah. FARAID_RULES §4.
# asal masalah 6 boleh di-aul ke 7/8/9/10; 12 ke 13/15/17; 24 ke 27.
# source: kaedah aul standard mazhab Syafie. verified_by: pending.

- id: FRD-061
  name: "Suami + dua saudara perempuan s.i.s (6 -> 7)"
  source: "1/2 + 2/3 = 7/6; aul 6->7"
  verified_by: pending
  input:
    deceased_gender: female
    net_estate: 70000
    heirs:
      - { type: husband, count: 1 }
      - { type: fullSister, count: 2 }
  expected:
    asal_masalah: 6
    shares:
      - { type: husband, fraction: "3/7", basis: aul, amount: 30000 }
      - { type: fullSister, count: 2, fraction: "4/7", fraction_each: "2/7", basis: aul, amount: 40000 }

