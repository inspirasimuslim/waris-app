# Hajb hirman (gugur terus) & hajb nuqsan (kurang bahagian). FARAID_RULES §3.
# source: kaedah pendindingan standard mazhab Syafie. verified_by: pending.

- id: FRD-031
  name: "Anak lelaki mendinding cucu lelaki"
  source: "Hajb hirman: far' warith lelaki lebih hampir"
  verified_by: pending
  input:
    deceased_gender: male
    net_estate: 120000
    heirs:
      - { type: son, count: 1 }
      - { type: sonsSon, count: 1 }
  expected:
    blocked: [sonsSon]
    shares:
      - { type: son, fraction: "1/1", basis: asabah, amount: 120000 }

