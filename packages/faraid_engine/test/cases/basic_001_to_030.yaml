# Kes asas — fardu, asabah bi-nafsihi, asabah bi-ghayrihi, asabah ma'a-ghayrihi.
# Semua kes di sini menjumlahkan tepat 1 (tiada aul/radd/tashih).
# source: kaedah faraid standard mazhab Syafie (kitab muktabar). verified_by: pending.

- id: FRD-001
  name: "Suami + saudara lelaki seibu-sebapa"
  source: "Kaedah asas: suami 1/2 kalalah, baki asabah"
  verified_by: pending
  input:
    deceased_gender: female
    net_estate: 100000
    heirs:
      - { type: husband, count: 1 }
      - { type: fullBrother, count: 1 }
  expected:
    shares:
      - { type: husband, fraction: "1/2", basis: fardu, amount: 50000 }
      - { type: fullBrother, fraction: "1/2", basis: asabah, amount: 50000 }

