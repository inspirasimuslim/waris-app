# Tashih — asal masalah dinaikkan supaya setiap bahagian individu jadi integer.
# FARAID_RULES §6. Enjin melaporkan asal_masalah (LCM penyebut fardu) dan
# asal_masalah_tashih (LCM penyebut bahagian setiap individu).
# source: kaedah tashih standard. verified_by: pending.

- id: FRD-096
  name: "Bapa + ibu + lima anak lelaki (6 -> 30)"
  source: "Baki 2/3 tidak boleh dibahagi 5 -> tashih 6 x 5 = 30"
  verified_by: pending
  input:
    deceased_gender: male
    net_estate: 300000
    heirs:
      - { type: father, count: 1 }
      - { type: mother, count: 1 }
      - { type: son, count: 5 }
  expected:
    asal_masalah: 6
    asal_masalah_tashih: 30
    shares:
      - { type: father, fraction: "1/6", basis: fardu, amount: 50000 }
      - { type: mother, fraction: "1/6", basis: fardu, amount: 50000 }
      - { type: son, count: 5, fraction: "2/3", fraction_each: "2/15", basis: asabah, amount: 200000 }

- id: FRD-097
  name: "Isteri + tiga anak lelaki + dua anak perempuan (8 -> 64)"
  source: "Baki 7/8 dibahagi 8 bahagian; tashih 8 x 8 = 64"
  verified_by: pending
  input:
    deceased_gender: male
    net_estate: 640000
    heirs:
      - { type: wife, count: 1 }
      - { type: son, count: 3 }
      - { type: daughter, count: 2 }
  expected:
    asal_masalah: 8
    asal_masalah_tashih: 64
    shares:
      - { type: wife, fraction: "1/8", basis: fardu, amount: 80000 }
      - { type: son, count: 3, fraction: "21/32", fraction_each: "7/32", basis: asabah, amount: 420000 }
      - { type: daughter, count: 2, fraction: "7/32", fraction_each: "7/64", basis: asabah, amount: 140000 }

