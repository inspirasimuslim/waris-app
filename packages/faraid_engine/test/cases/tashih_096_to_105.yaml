- id: FRD-100
  name: "Ibu + dua anak perempuan + tiga s/p sebapa (6 -> 18)"
  source: "S/p sebapa asabah ma'a-ghayrihi berkongsi 1/6; tashih 6 x 3 = 18"
  verified_by: pending
  input:
    deceased_gender: male
    net_estate: 180000
    heirs:
      - { type: mother, count: 1 }
      - { type: daughter, count: 2 }
      - { type: paternalSister, count: 3 }
  expected:
    asal_masalah: 6
    asal_masalah_tashih: 18
    shares:
      - { type: mother, fraction: "1/6", basis: fardu, amount: 30000 }
