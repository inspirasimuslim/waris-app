# Radd — jumlah saham fardu kurang daripada 1 dan tiada asabah. FARAID_RULES §4.
# Baki dikembalikan kepada waris fardu BUKAN pasangan mengikut nisbah.
# source: kaedah radd (pendapat majoriti; pasangan tidak menerima radd). verified_by: pending.

- id: FRD-081
  name: "Ibu sahaja"
  source: "Radd penuh kepada ibu"
  verified_by: pending
  input:
    deceased_gender: male
    net_estate: 30000
    heirs:
      - { type: mother, count: 1 }
  expected:
    shares:
      - { type: mother, fraction: "1/1", basis: radd, amount: 30000 }

