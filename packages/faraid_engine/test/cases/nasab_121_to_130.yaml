# Nasab tidak sabit — waris dengan nasab_confirmed: false ditapis keluar
# SEBELUM pengiraan (SPEC 1.4 langkah 2, SPEC 2.5). Enjin merekod mereka dalam
# senarai `blocked` dengan sebab nasab, bukan hajb.
# source: prinsip WARIS — nasab menapis waris, bukan graf keluarga. verified_by: pending.

- id: FRD-121
  name: "Anak lelaki nasab tidak sabit + isteri + ibu + bapa"
  source: "Anak ditapis -> menjadi umariyyatain (isteri + ibu + bapa)"
  verified_by: pending
  input:
    deceased_gender: male
    net_estate: 120000
    heirs:
      - { type: son, count: 1, nasab_confirmed: false }
      - { type: wife, count: 1 }
      - { type: mother, count: 1 }
      - { type: father, count: 1 }
  expected:
    blocked: [son]
    shares:
      - { type: wife, fraction: "1/4", basis: fardu, amount: 30000 }
      - { type: mother, fraction: "1/4", amount: 30000 }
      - { type: father, fraction: "1/2", basis: asabah, amount: 60000 }

